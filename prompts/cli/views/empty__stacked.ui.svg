<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-labelledby="title desc">
<title id="title">Dependency graph with no saved graph</title>
<desc id="desc">Search and filters precede a graph area showing no saved graph and a separate action to prepare dependencies.</desc>
<rect width="400" height="900" fill="#f5f7fb"/>
<g font-family="sans-serif" fill="#182536" font-size="15">
<g id="graph-header"><text x="16" y="32" font-size="22" font-weight="bold">Dependency graph</text><text x="16" y="56">example/crm · GitHub native links</text></g>
<g id="search"><rect x="16" y="74" width="368" height="38" rx="6" fill="white" stroke="#8192a8"/><text x="28" y="98">Search issues</text></g>
<g id="filters"><g id="filter-all"><text x="16" y="140">All</text></g><g id="filter-waiting"><text x="56" y="140">Waiting</text></g><g id="filter-ready"><text x="127" y="140">Ready</text></g><g id="filter-running"><text x="190" y="140">Running</text></g><g id="filter-unknown"><text x="273" y="140">Unknown</text></g></g>
<g id="sync-status"><text x="16" y="169">No saved sync</text></g><g id="refresh-graph"><text x="322" y="169">Refresh</text></g>
<g id="graph-canvas"><rect x="16" y="190" width="368" height="390" rx="8" fill="white" stroke="#c5cfdd"/>
<g id="empty-message"><text x="40" y="240">No saved graph</text></g>
<g id="prepare-dependencies"><rect x="40" y="262" width="200" height="40" rx="6" fill="#e9eff9" stroke="#7088a4"/><text x="52" y="288">Prepare dependencies</text></g>
<g id="zoom-in"><text x="40" y="548">Zoom in</text></g><g id="zoom-out"><text x="132" y="548">Zoom out</text></g><g id="fit-graph"><text x="235" y="548">Fit graph</text></g></g>
<g id="issue-details"><rect x="16" y="610" width="368" height="250" rx="8" fill="white" stroke="#c5cfdd"/><text x="32" y="640">No issue selected</text></g>
</g></svg>
