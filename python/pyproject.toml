[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd-cli"
version = "0.1.39"
description = "PDD: local Prompting guide, skills and recipes for your coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["pdd", "prompt-driven-development", "cli", "ai", "coding-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/promptdriven/pdd"
Repository = "https://github.com/promptdriven/pdd"
Issues = "https://github.com/promptdriven/pdd/issues"

[project.scripts]
pdd = "pdd_cli.cli:main"

[tool.setuptools]
packages = ["pdd_cli"]

[tool.setuptools.package-data]
pdd_cli = ["_bundled/**/*", "_bundled/**/.*"]
