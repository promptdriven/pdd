name: PDD checks

# No top-level `paths:` filter: a required gate job that never starts blocks PRs.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only; never cancel `main` or `merge_group` runs.
concurrency:
  group: pdd-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      release: ${{ steps.detect.outputs.release }}
      release_set: ${{ steps.detect.outputs.release_set }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Rust workspace and release-version changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          HAS_RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'test:release') }}
        run: |
          set -euo pipefail
          rust=false
          if [ -f Cargo.toml ]; then rust=true; fi

          release=false
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            base_ver=$(git show HEAD^1:package.json 2>/dev/null | jq -r '.version // empty' || true)
            head_ver=$(jq -r '.version // empty' package.json)
            if [ -n "$base_ver" ] && [ -n "$head_ver" ] && [ "$base_ver" != "$head_ver" ]; then
              release=true
            fi
          fi

          release_set=false
          if [ "$release" = "true" ] || [ "$HAS_RELEASE_LABEL" = "true" ] || { [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
            release_set=true
          fi

          {
            echo "rust=$rust"
            echo "release=$release"
            echo "release_set=$release_set"
          } >> "$GITHUB_OUTPUT"

  unit:
    name: unit (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Ensure shell test prerequisites
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run parallel offline unit tests
        id: unit-tests
        run: |
          unit_list=$(node scripts/list-tests.mjs --unit)
          test -n "$unit_list"
          mapfile -t unit_tests <<< "$unit_list"
          set +e
          node --import ./test/helpers/test-home.mjs --import ./test/helpers/test-net-guard.mjs \
            --test --test-concurrency=4 --test-timeout=600000 --test-shard=${{ matrix.shard }}/8 \
            "${unit_tests[@]}" 2>&1 | tee "$RUNNER_TEMP/tests-unit.tap"
          exit "${PIPESTATUS[0]}"
      - name: Run sequential tests (browser + timing-sensitive)
        if: success() || steps.unit-tests.outcome == 'failure'
        run: |
          serial_list=$(node scripts/list-tests.mjs --serial)
          test -n "$serial_list"
          mapfile -t serial_tests <<< "$serial_list"
          set +e
          node --import ./test/helpers/test-home.mjs --import ./test/helpers/test-net-guard.mjs \
            --test --test-concurrency=1 --test-timeout=600000 --test-shard=${{ matrix.shard }}/8 \
            "${serial_tests[@]}" 2>&1 | tee "$RUNNER_TEMP/tests-serial.tap"
          exit "${PIPESTATUS[0]}"
      - name: Summarize test counts
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/tests-unit.tap" "$RUNNER_TEMP/tests-serial.tap" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          import { readFileSync } from 'node:fs';
          const parseCounts = path => {
            let output = '';
            try { output = readFileSync(path, 'utf8').replace(/\r/g, ''); } catch { return null; }
            const idx = output.lastIndexOf('\n# tests ');
            const footer = idx >= 0 ? output.slice(idx + 1) : output.startsWith('# tests ') ? output : '';
            const match = footer.match(/^# tests (\d+)\n# suites \d+\n# pass (\d+)\n# fail (\d+)\n# cancelled (\d+)\n# skipped (\d+)\n# todo (\d+)\n# duration_ms [\d.]+(?:\n|$)/);
            const counts = match?.slice(1).map(Number);
            if (!counts || !counts.every(Number.isSafeInteger) || counts[0] !== counts.slice(1).reduce((a, b) => a + b, 0)) return null;
            return counts;
          };
          const rows = process.argv.slice(2).map(parseCounts);
          console.log('### unit');
          if (rows.some(row => !row)) {
            console.log('Test counts unavailable: no complete final TAP totals. See the test log.');
          } else {
            const [total, passed, failed, cancelled, skipped, todo] = rows.reduce((acc, row) => acc.map((v, i) => v + row[i]));
            console.log(`${passed}/${total} passed, ${failed} failed, ${cancelled} cancelled, ${skipped} skipped, ${todo} todo.`);
          }
          NODE

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Area 3 swaps this step to oxlint + dependency-cruiser.
      - name: Check architecture boundaries (G7)
        run: npm run check:arch

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build npm tarball and Python wheel once
        run: |
          set -euo pipefail
          trap 'rm -rf python/pdd_cli/_bundled' EXIT
          mkdir -p dist/npm dist/pypi
          npm pack --ignore-scripts --pack-destination dist/npm
          node scripts/sync-pypi-version.mjs --stage-bundle
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/pypi python
      - uses: actions/upload-artifact@v4
        with:
          name: pdd-package
          path: dist/
          retention-days: 1

  evidence-public:
    name: evidence-public
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pdd-package
          path: dist
      - name: Run public npm and wheel evidence suites
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          npm pack @promptdriven/pdd@latest --pack-destination "$RUNNER_TEMP/base"
          node scripts/evidence-run.mjs --suite scripts/evidence/public.suite.mjs \
            --base "$RUNNER_TEMP"/base/*.tgz --cand dist/npm/*.tgz --out "$RUNNER_TEMP/public-rows.json"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --no-deps dist/pypi/*.whl
          node scripts/evidence-run.mjs --suite scripts/evidence/wheel.suite.mjs \
            --cand "$RUNNER_TEMP/venv/bin/pdd" --out "$RUNNER_TEMP/wheel-rows.json"

  release-set:
    name: release-set (${{ matrix.target }})
    needs: [changes, package]
    if: needs.changes.outputs.release_set == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pnpm
            os: ubuntu-latest
          - target: volta
            os: ubuntu-latest
          - target: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.target == 'macos'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pdd-package
          path: dist
      - name: Verify pnpm global install + setup + upgrade hint
        if: matrix.target == 'pnpm'
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state" PNPM_HOME="$smoke_dir/pnpm-home" PDD_NO_UPDATE_CHECK=1
          mkdir -p "$HOME" "$PDD_STATE_DIR" "$PNPM_HOME"
          npm install --global --prefix "$smoke_dir/pnpm-tool" --no-audit --no-fund pnpm@10
          export PATH="$PNPM_HOME:$smoke_dir/pnpm-tool/bin:$PATH"
          expected=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          pnpm config set global-dir "$smoke_dir/pnpm/global"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm config set store-dir "$smoke_dir/pnpm/store"
          pnpm add -g "$PWD"/dist/npm/*.tgz --ignore-scripts
          test "$("$PNPM_HOME/pdd" --version 2>"$smoke_dir/ver.err")" = "$expected"
          test ! -s "$smoke_dir/ver.err"
          "$PNPM_HOME/pdd" setup --yes >"$smoke_dir/setup.out"
          grep -q "Done!" "$smoke_dir/setup.out"
          upg_status=0
          "$PNPM_HOME/pdd" upgrade >"$smoke_dir/upg.out" 2>"$smoke_dir/upg.err" || upg_status=$?
          test "$upg_status" -eq 1
          grep -q "pnpm add -g @promptdriven/pdd@latest" "$smoke_dir/upg.err"
      - name: Verify real Volta install and real pdd upgrade (#3628)
        if: matrix.target == 'volta'
        run: node scripts/evidence/probes/volta-upgrade.mjs dist/npm/*.tgz
      - name: Run public npm and wheel evidence suites on macOS
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          npm pack @promptdriven/pdd@latest --pack-destination "$RUNNER_TEMP/base"
          node scripts/evidence-run.mjs --suite scripts/evidence/public.suite.mjs \
            --base "$RUNNER_TEMP"/base/*.tgz --cand dist/npm/*.tgz --out "$RUNNER_TEMP/macos-public-rows.json"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --no-deps dist/pypi/*.whl
          node scripts/evidence-run.mjs --suite scripts/evidence/wheel.suite.mjs \
            --cand "$RUNNER_TEMP/venv/bin/pdd" --out "$RUNNER_TEMP/macos-wheel-rows.json"

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned deslop-please release binary
        run: |
          set -euo pipefail
          ver="v0.1.4"
          asset="deslop-please-x86_64-unknown-linux-musl-${ver}.tar.gz"
          sha="4d2a26d55db443f652bc9bb1ce1821a18cae16dd6bed5356755a74036e2bf1ca"
          curl -fsSL "https://github.com/deterministic-machines/deslop-please/releases/download/${ver}/${asset}" -o "$RUNNER_TEMP/${asset}"
          echo "${sha}  $RUNNER_TEMP/${asset}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP/bin" deslop-please
          chmod +x "$RUNNER_TEMP/bin/deslop-please"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: deslop-please

  main-gate:
    name: main-gate
    if: ${{ always() }}
    needs: [changes, unit, lint, package, evidence-public, rust, release-set]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all active gate jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_SKIP: >-
            {"rust": ${{ needs.changes.outputs.rust != 'true' }},
             "release-set": ${{ needs.changes.outputs.release_set != 'true' }}}
        run: |
          echo "$NEEDS" | jq -e --argjson ok "$MAY_SKIP" \
            'to_entries | all(.value.result == "success" or (.value.result == "skipped" and $ok[.key] == true))'

  # Thin alias keeping branch protection green during changeover to `main-gate`.
  tests:
    name: tests
    if: ${{ always() }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require unit shards to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: test "$UNIT_RESULT" = success
