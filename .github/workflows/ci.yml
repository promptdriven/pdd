name: PDD checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: test-shard (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Ensure shell test prerequisites
        run: |
          command -v bash
          bash --version
          if ! command -v zsh; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi
          command -v zsh
          zsh --version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check architecture boundaries (G7)
        if: matrix.shard == 1
        run: npm run check:arch
      - name: Run offline unit tests
        id: unit-tests
        run: |
          unit_list=$(node scripts/list-tests.mjs --unit)
          test -n "$unit_list"
          mapfile -t unit_tests <<< "$unit_list"
          set +e
          node --import ./test/helpers/test-home.mjs --import ./test/helpers/test-net-guard.mjs --test --test-concurrency=4 --test-shard=${{ matrix.shard }}/8 "${unit_tests[@]}" 2>&1 | tee "$RUNNER_TEMP/tests-unit.tap"
          exit "${PIPESTATUS[0]}"
      - name: Run sequential browser tests
        if: success() || steps.unit-tests.outcome == 'failure'
        run: |
          browser_list=$(node scripts/list-tests.mjs --browser)
          test -n "$browser_list"
          mapfile -t browser_tests <<< "$browser_list"
          set +e
          # Keep Chrome startup sequential so browser tests do not compete across workers.
          node --import ./test/helpers/test-home.mjs --import ./test/helpers/test-net-guard.mjs --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/8 "${browser_tests[@]}" 2>&1 | tee "$RUNNER_TEMP/tests-browser.tap"
          exit "${PIPESTATUS[0]}"
      - name: Summarize test counts
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/tests-unit.tap" "$RUNNER_TEMP/tests-browser.tap" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          import { readFileSync } from 'node:fs';
          const parseCounts = path => {
            let output = '';
            try { output = readFileSync(path, 'utf8').replace(/\r/g, ''); } catch { return null; }
            const idx = output.lastIndexOf('\n# tests ');
            const footer = idx >= 0 ? output.slice(idx + 1) : output.startsWith('# tests ') ? output : '';
            const match = footer.match(/^# tests (\d+)\n# suites \d+\n# pass (\d+)\n# fail (\d+)\n# cancelled (\d+)\n# skipped (\d+)\n# todo (\d+)\n# duration_ms [\d.]+(?:\n|$)/);
            const counts = match?.slice(1).map(Number);
            if (!counts || !counts.every(Number.isSafeInteger) || counts[0] !== counts.slice(1).reduce((a, b) => a + b, 0)) return null;
            return counts;
          };
          const rows = process.argv.slice(2).map(parseCounts);
          console.log('### tests');
          if (rows.some(row => !row)) {
            console.log('Test counts unavailable: no complete final TAP totals. See the test log.');
          } else {
            const [total, passed, failed, cancelled, skipped, todo] = rows.reduce((acc, row) => acc.map((v, i) => v + row[i]));
            console.log(`${passed}/${total} passed, ${failed} failed, ${cancelled} cancelled, ${skipped} skipped, ${todo} todo.`);
          }
          NODE
      - run: node bin/pdd.mjs --help
      - run: npm pack --ignore-scripts --dry-run

  public:
    # main requires this check name; every offline test shard must pass.
    name: tests
    if: ${{ always() }}
    needs: test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard to pass
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: test "$SHARD_RESULT" = success

  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Pack, install and smoke the installed command
        run: |
          smoke_dir=$(mktemp -d)
          checks=0
          trap 'echo "### install-smoke" >> "$GITHUB_STEP_SUMMARY"; echo "$checks/4 command smoke checks passed (help, local lint, saved-local read, empty-state read). No runtime scenario tests ran." >> "$GITHUB_STEP_SUMMARY"; rm -rf "$smoke_dir"' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state"
          export PDD_RUNTIME_URL=http://127.0.0.1:1
          mkdir -p "$HOME" "$PDD_STATE_DIR"
          npm pack --ignore-scripts --json --pack-destination "$smoke_dir" > "$smoke_dir/pack.json"
          archive=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$smoke_dir/pack.json")
          node --input-type=module -e 'import { bundleInstalledDependencies } from "./test/helpers/pack-offline.mjs"; bundleInstalledDependencies(process.cwd(), process.argv[1], process.argv[2]);' "$smoke_dir/$archive" "$smoke_dir"
          npm install --global --prefix "$smoke_dir/install" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$smoke_dir/$archive"
          installed="$smoke_dir/install/bin/pdd"
          "$installed" --help
          checks=$((checks + 1))
          cp -R test/fixtures/harbor "$smoke_dir/harbor"
          cd "$smoke_dir/harbor"
          git init --quiet
          git add .
          "$installed" lint --json place-order > "$smoke_dir/lint.json"
          node --input-type=module - "$smoke_dir/lint.json" "$PDD_STATE_DIR" <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(result.exit_code, 0);
          assert.equal(result.local_only, true);
          assert.deepEqual(result.problems, []);
          assert.equal(existsSync(join(process.argv[3], 'batches')), false, 'offline lint writes zero batch state');
          NODE
          checks=$((checks + 1))
          "$installed" status --json > "$smoke_dir/status.json"
          node --input-type=module - "$smoke_dir/status.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.ok(result && typeof result === 'object');
          NODE
          checks=$((checks + 1))
          mkdir -p "$smoke_dir/empty-state"
          read_result=0
          PDD_STATE_DIR="$smoke_dir/empty-state" "$installed" test --read > "$smoke_dir/read.log" 2>&1 || read_result=$?
          cat "$smoke_dir/read.log"
          test "$read_result" -eq 2
          checks=$((checks + 1))

  install-matrix:
    name: install-matrix (${{ matrix.manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manager: [npm-messy-home, pypi-venv, pnpm-global, volta-global]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.manager == 'pypi-venv'
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify real npm install -g + messy HOME setup/upgrade (#3645/#3646)
        if: matrix.manager == 'npm-messy-home'
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state" PDD_NO_UPDATE_CHECK=1
          mkdir -p "$HOME/.agents/skills" "$HOME/.claude/skills" "$HOME/.gemini/config/skills" "$PDD_STATE_DIR"
          npm pack --ignore-scripts --json --pack-destination "$smoke_dir" > "$smoke_dir/pack.json"
          archive=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$smoke_dir/pack.json")
          expected=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          node --input-type=module -e 'import { bundleInstalledDependencies } from "./test/helpers/pack-offline.mjs"; bundleInstalledDependencies(process.cwd(), process.argv[1], process.argv[2]);' "$smoke_dir/$archive" "$smoke_dir"
          npm install --global --prefix "$smoke_dir/prefix" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$smoke_dir/$archive"
          pdd="$smoke_dir/prefix/bin/pdd"
          export PATH="$smoke_dir/prefix/bin:$PATH"

          # Seed messy laptop HOME: unmarked 0.1.39 split skills, Claude symlinks, non-PDD skill, 0-byte mcp_config.json, whitespace settings.json.
          for s in pdd-setup pdd-prompting pdd-small-change pdd-bug pdd-feature pdd-product pdd-graph; do
            mkdir -p "$HOME/.agents/skills/$s" "$HOME/.gemini/config/skills/$s"
            printf -- '---\nname: %s\nmetadata:\n  pdd-skills: 0.1.39\n---\nold\n' "$s" > "$HOME/.agents/skills/$s/SKILL.md"
            printf -- '---\nname: %s\nmetadata:\n  pdd-skills: 0.1.39\n---\nold\n' "$s" > "$HOME/.gemini/config/skills/$s/SKILL.md"
            ln -s "../../.agents/skills/$s" "$HOME/.claude/skills/$s"
          done
          mkdir -p "$HOME/.agents/skills/finish-pr"
          printf 'keep\n' > "$HOME/.agents/skills/finish-pr/SKILL.md"
          : > "$HOME/.gemini/config/mcp_config.json"
          printf '   \n\t\n' > "$HOME/.gemini/settings.json"

          ver_before=$("$pdd" --version 2>"$smoke_dir/before.err")
          test "$ver_before" = "$expected"
          grep -q "Retired PDD skills remain" "$smoke_dir/before.err"

          "$pdd" setup --yes >"$smoke_dir/setup.out"
          grep -q "Done!" "$smoke_dir/setup.out"
          grep -q "Removed retired PDD skills" "$smoke_dir/setup.out"
          test -f "$HOME/.agents/skills/pdd/SKILL.md"
          test -f "$HOME/.claude/skills/pdd/SKILL.md"
          test -f "$HOME/.gemini/config/skills/pdd/SKILL.md"
          test ! -e "$HOME/.agents/skills/pdd-bug"
          test ! -L "$HOME/.claude/skills/pdd-bug"
          test -f "$HOME/.agents/skills/finish-pr/SKILL.md"
          node -e 'const fs = require("node:fs"); JSON.parse(fs.readFileSync(process.argv[1], "utf8")); JSON.parse(fs.readFileSync(process.argv[2], "utf8"));' "$HOME/.gemini/config/mcp_config.json" "$HOME/.gemini/settings.json"

          "$pdd" setup --upgrade >"$smoke_dir/upg.out"
          test ! -s "$smoke_dir/upg.out"
          ver_after=$("$pdd" --version 2>"$smoke_dir/after.err")
          test "$ver_after" = "$expected"
          test ! -s "$smoke_dir/after.err"
      - name: Verify real Python venv pdd-cli wheel install + setup + upgrade guard
        if: matrix.manager == 'pypi-venv'
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir" python/pdd_cli/_bundled' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state" PDD_CLI_CACHE_DIR="$smoke_dir/cache" PDD_NO_UPDATE_CHECK=1 PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$HOME/.gemini/config" "$PDD_STATE_DIR" "$PDD_CLI_CACHE_DIR" "$smoke_dir/pypi-dist"
          expected=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')

          node scripts/sync-pypi-version.mjs --stage-bundle
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$smoke_dir/pypi-dist" python
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/pip" install --no-deps "$smoke_dir/pypi-dist"/*.whl

          export PATH="$smoke_dir/venv/bin:$PATH"
          ver=$(PDD_CLI_OFFLINE=1 PDD_CLI_IGNORE_CHECKOUT=1 "$smoke_dir/venv/bin/pdd" --version 2>"$smoke_dir/ver.err")
          test "$ver" = "$expected"
          test ! -s "$smoke_dir/ver.err"

          : > "$HOME/.gemini/config/mcp_config.json"
          PDD_CLI_OFFLINE=1 PDD_CLI_IGNORE_CHECKOUT=1 "$smoke_dir/venv/bin/pdd" setup --yes >"$smoke_dir/setup.out"
          grep -q "Done!" "$smoke_dir/setup.out"
          test -f "$HOME/.agents/skills/pdd/SKILL.md"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));' "$HOME/.gemini/config/mcp_config.json"

          upg_status=0
          PDD_CLI_OFFLINE=1 PDD_CLI_IGNORE_CHECKOUT=1 "$smoke_dir/venv/bin/pdd" upgrade >"$smoke_dir/upg.out" 2>"$smoke_dir/upg.err" || upg_status=$?
          test "$upg_status" -eq 1
          grep -q "pip install -U pdd-cli" "$smoke_dir/upg.err"
      - name: Verify real pnpm global install + setup + upgrade guard
        if: matrix.manager == 'pnpm-global'
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state" PNPM_HOME="$smoke_dir/pnpm-home" PDD_NO_UPDATE_CHECK=1
          mkdir -p "$HOME" "$PDD_STATE_DIR" "$PNPM_HOME"
          npm install --global --prefix "$smoke_dir/pnpm-tool" --no-audit --no-fund pnpm@10
          export PATH="$PNPM_HOME:$smoke_dir/pnpm-tool/bin:$PATH"
          npm pack --ignore-scripts --json --pack-destination "$smoke_dir" > "$smoke_dir/pack.json"
          archive=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$smoke_dir/pack.json")
          expected=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          node --input-type=module -e 'import { bundleInstalledDependencies } from "./test/helpers/pack-offline.mjs"; bundleInstalledDependencies(process.cwd(), process.argv[1], process.argv[2]);' "$smoke_dir/$archive" "$smoke_dir"

          pnpm config set global-dir "$smoke_dir/pnpm/global"
          pnpm config set global-bin-dir "$PNPM_HOME"
          pnpm config set store-dir "$smoke_dir/pnpm/store"
          pnpm add -g "$smoke_dir/$archive" --ignore-scripts
          ver=$("$PNPM_HOME/pdd" --version 2>"$smoke_dir/ver.err")
          test "$ver" = "$expected"
          test ! -s "$smoke_dir/ver.err"
          "$PNPM_HOME/pdd" setup --yes >"$smoke_dir/setup.out"
          grep -q "Done!" "$smoke_dir/setup.out"
          upg_status=0
          "$PNPM_HOME/pdd" upgrade >"$smoke_dir/upg.out" 2>"$smoke_dir/upg.err" || upg_status=$?
          test "$upg_status" -eq 1
          grep -q "pnpm add -g @promptdriven/pdd@latest" "$smoke_dir/upg.err"
      - name: Verify real Volta install + setup + setup --upgrade
        if: matrix.manager == 'volta-global'
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          export HOME="$smoke_dir/home" PDD_STATE_DIR="$smoke_dir/state" VOLTA_HOME="$smoke_dir/volta" PDD_NO_UPDATE_CHECK=1
          mkdir -p "$HOME/.gemini/config" "$PDD_STATE_DIR" "$VOLTA_HOME"
          curl -fsSL https://get.volta.sh | bash -s -- --skip-setup
          export PATH="$VOLTA_HOME/bin:$PATH"
          volta install node@22

          npm pack --ignore-scripts --json --pack-destination "$smoke_dir" > "$smoke_dir/pack.json"
          archive=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename' "$smoke_dir/pack.json")
          expected=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          node --input-type=module -e 'import { bundleInstalledDependencies } from "./test/helpers/pack-offline.mjs"; bundleInstalledDependencies(process.cwd(), process.argv[1], process.argv[2]);' "$smoke_dir/$archive" "$smoke_dir"

          # Serve packed tarball from a local loopback npm registry so real `volta install @promptdriven/pdd` installs natively without hitting npmjs.org.
          node --input-type=module - "$smoke_dir/$archive" "$expected" "$smoke_dir/reg.port" <<'NODE' &
          import http from 'node:http';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const [, , archive, version, portFile] = process.argv;
          const tgz = readFileSync(archive);
          const shasum = createHash('sha1').update(tgz).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(tgz).digest('base64')}`;
          const server = http.createServer((req, res) => {
            const rawPath = (req.url || '/').split('?')[0];
            if (rawPath === '/pkg.tgz') {
              res.writeHead(200, { 'content-type': 'application/octet-stream' });
              res.end(tgz);
              return;
            }
            const decoded = decodeURIComponent(rawPath);
            if (decoded !== '/@promptdriven/pdd' && decoded !== `/@promptdriven/pdd/${version}`) {
              res.writeHead(302, { location: `https://registry.npmjs.org${req.url}` });
              res.end();
              return;
            }
            const addr = server.address();
            const versionDoc = {
              name: '@promptdriven/pdd',
              version,
              bin: { pdd: 'bin/pdd.mjs', 'pdd-codex': 'bin/pdd-codex.mjs', 'pdd-claude': 'bin/pdd-claude.mjs' },
              bundleDependencies: ['@promptdriven/runtime-client'],
              dist: { shasum, integrity, tarball: `http://127.0.0.1:${addr.port}/pkg.tgz` },
            };
            const body = decoded === `/@promptdriven/pdd/${version}`
              ? versionDoc
              : { name: '@promptdriven/pdd', 'dist-tags': { latest: version }, versions: { [version]: versionDoc } };
            res.writeHead(200, { 'content-type': 'application/json' });
            res.end(JSON.stringify(body));
          });
          server.listen(0, '127.0.0.1', () => {
            writeFileSync(portFile, String(server.address().port));
          });
          setTimeout(() => server.close(), 120000);
          NODE
          reg_pid=$!
          trap 'kill "$reg_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          for _ in $(seq 1 50); do [ -s "$smoke_dir/reg.port" ] && break; sleep 0.1; done
          reg_port=$(cat "$smoke_dir/reg.port")
          printf 'registry=http://127.0.0.1:%s/\n' "$reg_port" > "$HOME/.npmrc"
          npm_config_registry="http://127.0.0.1:$reg_port" volta install "@promptdriven/pdd@$expected"

          ver=$("$VOLTA_HOME/bin/pdd" --version 2>"$smoke_dir/ver.err")
          test "$ver" = "$expected"
          test ! -s "$smoke_dir/ver.err"
          : > "$HOME/.gemini/config/mcp_config.json"
          "$VOLTA_HOME/bin/pdd" setup --yes >"$smoke_dir/setup.out"
          grep -q "Done!" "$smoke_dir/setup.out"
          test -f "$HOME/.agents/skills/pdd/SKILL.md"
          "$VOLTA_HOME/bin/pdd" setup --upgrade >"$smoke_dir/upg.out"
          test ! -s "$smoke_dir/upg.out"
