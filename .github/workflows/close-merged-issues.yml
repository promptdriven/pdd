name: Close merged PR issues

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close linked issues from merged PR and merged sub-PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const repo = process.env.REPO;
          const apiBase = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/+$/, '');
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };

          async function gh(path, options = {}) {
            const res = await fetch(`${apiBase}${path}`, { ...options, headers: { ...headers, ...options.headers } });
            if (res.status === 204 || res.status === 404 || res.status === 410) return { status: res.status, data: null };
            const data = await res.json().catch(() => null);
            if (!res.ok) throw new Error(`${options.method ?? 'GET'} ${path} -> ${res.status}`);
            return { status: res.status, data };
          }

          function plainPrText(body) {
            let fence = null;
            return String(body ?? '').replace(/\r\n?/g, '\n').split('\n').map(line => {
              const mark = line.trim().match(/^(`{3,}|~{3,})/)?.[1];
              if (fence) { if (mark && line.trim().startsWith(fence) && !line.trim().slice(mark.length).trim()) fence = null; return ''; }
              const open = /^ {0,3}(?:(`{3,})[^`]*|(~{3,}).*)$/.exec(line);
              if (open) { fence = open[1] ?? open[2]; return ''; }
              return line;
            }).join('\n')
              .replace(/(?<![`\\])(`+)(?!`)(?:(?!\n[ \t]*\n)[\s\S])*?(?<!`)\1(?!`)/g, ' ')
              .replace(/<!--[\s\S]*?-->/g, ' ');
          }

          function closingIssueNumbers(body, repoName) {
            const plain = plainPrText(body);
            if (/^\s*Not fixed yet:/im.test(plain)) return [];
            const escaped = repoName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const ref = `(?:(?<![\\w./-])${escaped}#(\\d+)|https?:\\/\\/github\\.com\\/${escaped}\\/issues\\/(\\d+)|(?<![\\w./-])#(\\d+))(?![\\w/])`;
            const listRe = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)(?!\\u200b)(?::[ \\t]*|[ \\t]+)(${ref}(?:(?:[ \\t]*,[ \\t]*(?:and[ \\t]+)?|[ \\t]+and[ \\t]+)${ref})*)`, 'gi');
            const numRe = new RegExp(ref, 'gi');
            const out = new Set();
            for (const m of plain.matchAll(listRe)) {
              for (const n of m[1].matchAll(numRe)) out.add(Number(n[1] ?? n[2] ?? n[3]));
            }
            return [...out].filter(n => Number.isSafeInteger(n) && n > 0);
          }

          const sources = new Map();
          for (const n of closingIssueNumbers(pr.body, repo)) sources.set(n, pr.number);

          const headRef = pr.head?.ref, headSha = pr.head?.sha, baseRef = pr.base?.ref, baseSha = pr.base?.sha;
          const hasBaseSha = /^[0-9a-f]{40}$/i.test(String(baseSha ?? '')) && baseSha !== pr.merge_commit_sha;
          if (headRef && headSha && headRef !== baseRef) {
            for (let page = 1; page <= 2; page++) {
              const { data: subPrs } = await gh(`/repos/${repo}/pulls?state=closed&base=${encodeURIComponent(headRef)}&per_page=100&page=${page}`);
              if (!Array.isArray(subPrs) || !subPrs.length) break;
              for (const sub of subPrs) {
                if (!sub.merged_at || !/^[0-9a-f]{40}$/i.test(String(sub.merge_commit_sha ?? ''))) continue;
                if (String(sub.head?.repo?.full_name ?? '').toLowerCase() !== repo.toLowerCase()) continue;
                const nums = closingIssueNumbers(sub.body, repo);
                if (!nums.length) continue;
                const { status, data: cmp } = await gh(`/repos/${repo}/compare/${sub.merge_commit_sha}...${headSha}`);
                if (status !== 200 || !['ahead', 'identical'].includes(cmp?.status)) continue;
                if (hasBaseSha) {
                  const { status: baseStatus, data: baseCmp } = await gh(`/repos/${repo}/compare/${baseSha}...${sub.merge_commit_sha}`);
                  if (baseStatus !== 200 || !(baseCmp?.ahead_by > 0)) continue;
                }
                for (const n of nums) if (!sources.has(n)) sources.set(n, sub.number);
              }
              if (subPrs.length < 100) break;
            }
          }

          for (const [issueNum, viaPr] of sources) {
            try {
              const { status, data: issue } = await gh(`/repos/${repo}/issues/${issueNum}`);
              if (status !== 200 || !issue || issue.pull_request) continue;
              if (issue.repository_url && !String(issue.repository_url).toLowerCase().endsWith(`/repos/${repo.toLowerCase()}`)) continue;
              if (issue.state === 'open') {
                await gh(`/repos/${repo}/issues/${issueNum}`, {
                  method: 'PATCH',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ state: 'closed', state_reason: 'completed' }),
                });
                await gh(`/repos/${repo}/issues/${issueNum}/comments`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    body: `Closed automatically when https://github.com/${repo}/pull/${pr.number} merged into \`${baseRef}\`${viaPr !== pr.number ? ` (from https://github.com/${repo}/pull/${viaPr})` : ''}.`,
                  }),
                });
              }
              const labels = (issue.labels ?? []).map(l => typeof l === 'string' ? l : l?.name).filter(Boolean);
              for (const stale of ['pdd:working', 'pdd:would-merge']) {
                if (labels.includes(stale)) await gh(`/repos/${repo}/issues/${issueNum}/labels/${encodeURIComponent(stale)}`, { method: 'DELETE' });
              }
            } catch (error) {
              console.error(`Failed to close or clean issue #${issueNum}: ${error.message}`);
              process.exitCode = 1;
            }
          }
          NODE
