name: Protected Global-Sync M0 Bootstrap

# This workflow is intentionally target-triggered: GitHub evaluates this file
# from the protected base, never from the PR head.  It only fetches candidate
# Git objects as data; it never checks out, imports, or runs candidate code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-m0-bootstrap:
    if: github.event.pull_request.number == 2301 && github.event.pull_request.draft == false
    name: Protected M0 bootstrap gate
    runs-on: ubuntu-latest
    # This existing GitHub Environment scopes the private-canary credentials;
    # its settings and secrets are administered outside this workflow.
    environment:
      name: pdd-cloud-read
    timeout-minutes: 45
    env:
      EVENT_NAME: pull_request_target
      PDD_CLOUD_SHA: 09f9d3fea71c4c0ed6655f2acd5e95b14a32c3c8
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout protected workflow base
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up protected Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install protected-base dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: --no-deps -r .pdd/global-sync/runtime-linux-x86_64-cp312.lock

      - name: Verify candidate Git objects against protected policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I scripts/verify_global_sync_m0_bootstrap.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --protected-base-sha "$PR_BASE_SHA" \
            --candidate-head-sha "$PR_HEAD_SHA" \
            --workflow-base-sha "$PR_BASE_SHA" \
            --event-name "$EVENT_NAME" \
            --phase gate \
            --output "$RUNNER_TEMP/m0-bootstrap-gate-proof.json"

      - name: Mint read-only pdd_cloud canary token
        id: pdd_cloud_token
        # actions/create-github-app-token v3.2.0.  This step is protected-base
        # code and follows a passing no-candidate-execution gate.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PDD_CLOUD_APP_ID }}
          private-key: ${{ secrets.PDD_CLOUD_APP_PRIVATE_KEY }}
          owner: promptdriven
          repositories: pdd_cloud
          permission-contents: read

      - name: Fetch exact private canary, then revoke its token
        env:
          PDD_CLOUD_TOKEN: ${{ steps.pdd_cloud_token.outputs.token }}
        run: |
          set -euo pipefail
          canary_git="$RUNNER_TEMP/pdd-cloud-m0-canary.git"
          revoke_canary_token() {
            GH_TOKEN="$PDD_CLOUD_TOKEN" gh api --method DELETE /installation/token >/dev/null 2>&1 || true
            unset PDD_CLOUD_TOKEN GH_TOKEN
          }
          trap revoke_canary_token EXIT
          python -I scripts/verify_global_sync_m0_bootstrap.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --protected-base-sha "$PR_BASE_SHA" \
            --candidate-head-sha "$PR_HEAD_SHA" \
            --workflow-base-sha "$PR_BASE_SHA" \
            --event-name "$EVENT_NAME" \
            --phase canary-fetch \
            --pdd-cloud-git-dir "$canary_git" \
            --pdd-cloud-sha "$PDD_CLOUD_SHA" \
            --output "$RUNNER_TEMP/m0-bootstrap-canary-fetch-proof.json"
          GH_TOKEN="$PDD_CLOUD_TOKEN" gh api --method DELETE /installation/token
          unset PDD_CLOUD_TOKEN GH_TOKEN
          trap - EXIT

      - name: Replay frozen protected sample against inert Git data
        run: |
          set -euo pipefail
          python -I scripts/verify_global_sync_m0_bootstrap.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --protected-base-sha "$PR_BASE_SHA" \
            --candidate-head-sha "$PR_HEAD_SHA" \
            --workflow-base-sha "$PR_BASE_SHA" \
            --event-name "$EVENT_NAME" \
            --phase replay \
            --prior-proof "$RUNNER_TEMP/m0-bootstrap-gate-proof.json" \
            --pdd-cloud-git-dir "$RUNNER_TEMP/pdd-cloud-m0-canary.git" \
            --output "$RUNNER_TEMP/m0-bootstrap-final-proof.json"

      - name: Upload protected M0 proof
        if: success()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: protected-m0-bootstrap-proof-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/m0-bootstrap-final-proof.json
