name: auto-heal

# Required status check on `main`. Posts a check named "auto-heal" against
# the PR head SHA via the Checks API so it appears on the PR regardless of
# whether the trigger was a PR event or a /heal comment.
#
# Compute runs in pdd_cloud's GCP project (prompt-driven-development-stg)
# via Cloud Build using a pre-staged build-context tarball. This workflow
# only dispatches the build and surfaces its status. For the normal auto-heal
# path, no LLM or PEM secrets ever land on a GitHub-Actions runner. The
# one-shot migration temporarily materializes the PEM only on the protected
# pdd-cloud-read environment runner. Its cleanup job removes the temporary
# App-secret copies and migration-token binding after verification succeeds.
#
# ---- Two distinct GitHub Apps ----
# These MUST be different Apps (separation of duty):
#   App A — `pdd-cloud-auth-reader`: Metadata: Read on promptdriven/pdd_cloud
#     only. Used HERE to authorize the requester. Its PEM must exist only in
#     the `pdd-cloud-read` GitHub Environment, restricted to the `main`
#     branch (PDD_CLOUD_APP_ID, PDD_CLOUD_APP_PRIVATE_KEY).
#   App B — `prompt-driven-github-staging` (existing): write perms on
#     promptdriven/pdd. Used INSIDE the Cloud Build to push the heal commit
#     back to the PR branch. PEM stored only in GCP Secret Manager
#     (gemini-dispatch-gh-app-private-key).
#
# ---- Security boundaries ----
# - `pull_request_target` runs workflow code from main, never from PR head,
#   so a fork PR cannot modify the auth gate. PR code only runs inside
#   Cloud Build, which has no access to this workflow's GHA secrets.
# - The dispatcher SA is impersonable ONLY by this exact workflow file at
#   refs/heads/main (WIF attribute_condition + principalSet pinning to
#   attribute.workflow_ref). Any new workflow on this repo cannot mint a
#   token for the dispatcher SA.
# - Fork PRs short-circuit BEFORE the App token is minted; "neutral" check
#   conclusion lets them merge (treated as passing by branch protection)
#   without an actual heal.
# - Every event-derived value is passed through `env:` and read via shell
#   variables — never interpolated directly into `run:` blocks. Markdown
#   summaries are built from workflow-controlled values only.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  # One-shot secret migration. Its jobs are additionally fail-closed to the
  # canonical repository and refs/heads/main below.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  id-token: write   # Workload Identity Federation to GCP

# Do NOT cancel in-progress runs. Cancelling a required check mid-flight
# muddies merge semantics; let parallel runs race for the latest SHA's check.
# Cancelled-then-success on an older SHA does not affect protection on the
# newer SHA, so there is no abuse vector to consider.
concurrency:
  group: auto-heal-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  heal:
    # Non-draft PR events, or a /heal comment on a PR (issue-comment events
    # for issues that aren't PRs are filtered out). `startsWith('/heal')`
    # also matches /healthcheck — the pre-flight step rejects false positives
    # before any privileged work runs.
    if: |
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment'
        && github.event.action == 'created'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/heal'))
    environment: pdd-cloud-read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pre-flight (validate trigger + resolve PR)
        id: pf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          PR_NUMBER_FROM_PR: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA_FROM_PR: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO_FROM_PR: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTER_FROM_PR: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REQUESTER_FROM_COMMENT: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # For issue_comment, require /heal as a standalone first token on
          # the first line. Rejects /healthcheck, /healz, etc.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # tr -d '\r' guards against CRLF line endings that some clients
            # may submit (GitHub doesn't contractually normalize to LF).
            first_token=$(printf '%s' "$BODY" | head -n1 | tr -d '\r' | awk '{print $1}')
            if [ "$first_token" != "/heal" ]; then
              echo "Comment first token '$first_token' is not '/heal'; ignoring."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr_number="$PR_NUMBER_FROM_PR"
            pr_head_sha="$PR_HEAD_SHA_FROM_PR"
            pr_head_repo="$PR_HEAD_REPO_FROM_PR"
            requester="$REQUESTER_FROM_PR"
          else
            pr_number="$ISSUE_NUMBER"
            pr_meta=$(gh api "repos/$REPO/pulls/$pr_number" \
              --jq '[.head.sha, (.head.repo.full_name // "")] | @tsv')
            pr_head_sha=$(printf '%s' "$pr_meta" | cut -f1)
            pr_head_repo=$(printf '%s' "$pr_meta" | cut -f2)
            requester="$REQUESTER_FROM_COMMENT"
          fi

          if [ -z "$pr_number" ] || [ -z "$pr_head_sha" ] || [ -z "$requester" ]; then
            echo "::error::Failed to resolve PR fields (number=$pr_number sha=$pr_head_sha requester=$requester)"
            exit 1
          fi

          fork=false
          if [ "$pr_head_repo" != "$REPO" ]; then
            fork=true
          fi

          trusted_app_requester=false
          if [ "$EVENT_NAME" = "pull_request_target" ] &&
             [ "$fork" = "false" ] &&
             [ "$requester" = "prompt-driven-github[bot]" ]; then
            trusted_app_requester=true
          fi

          {
            echo "skip=false"
            echo "fork=$fork"
            echo "trusted_app_requester=$trusted_app_requester"
            echo "pr_number=$pr_number"
            echo "pr_head_sha=$pr_head_sha"
            echo "pr_head_repo=$pr_head_repo"
            echo "requester=$requester"
          } >> "$GITHUB_OUTPUT"

      - name: Post check_run (in_progress) on PR head SHA
        if: steps.pf.outputs.skip != 'true'
        id: check_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.pf.outputs.pr_head_sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          check_id=$(gh api -X POST \
            "repos/$REPO/check-runs" \
            -f name='auto-heal' \
            -f head_sha="$PR_HEAD_SHA" \
            -f status='in_progress' \
            -f details_url="$RUN_URL" \
            --jq .id)
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"

      # Short-circuit fork PRs BEFORE minting any App token. Auto-heal pushes
      # commits back to the PR branch which is impossible on a fork; "neutral"
      # is treated as passing by GitHub branch protection, so fork PRs are
      # not permanently blocked from merging.
      - name: Short-circuit fork PRs (neutral conclusion)
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check_start.outputs.check_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Summary is built from workflow-controlled values only. Never
          # interpolate event-derived strings (PR title, comment body, branch
          # names) into rendered markdown on a check.
          gh api -X PATCH "repos/$REPO/check-runs/$CHECK_ID" \
            -f status='completed' \
            -f conclusion='neutral' \
            -f "output[title]=auto-heal skipped (fork PR)" \
            -f "output[summary]=Fork PRs are not auto-healed because the heal pushes commits to the PR branch (not possible across forks). [Workflow run]($RUN_URL)."

      - name: Mint pdd_cloud App token
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        id: app_token
        # SHA-pinned to v3.2.0 (https://github.com/actions/create-github-app-token/releases/tag/v3.2.0)
        # Pin normal healing to Metadata:Read even if the externally managed
        # App gains broader permissions later.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PDD_CLOUD_APP_ID }}
          private-key: ${{ secrets.PDD_CLOUD_APP_PRIVATE_KEY }}
          owner: promptdriven
          repositories: pdd_cloud
          permission-metadata: read

      - name: Authorize requester (must be pdd_cloud collaborator)
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REQUESTER: ${{ steps.pf.outputs.requester }}
          TRUSTED_APP_REQUESTER: ${{ steps.pf.outputs.trusted_app_requester }}
        run: |
          set -euo pipefail
          if [ -z "$REQUESTER" ]; then
            echo "::error::requester unresolved; refusing to authorize"
            exit 1
          fi
          # Generated internal PRs are authored by prompt-driven-github[bot],
          # a GitHub App identity that cannot be a repository collaborator.
          # Pre-flight only marks this exact requester as trusted on
          # non-fork pull_request_target events. Human /heal comments still
          # go through the pdd_cloud collaborator check below.
          if [ "$TRUSTED_APP_REQUESTER" = "true" ]; then
            echo "authorized: $REQUESTER is the trusted generated-PR App identity"
            exit 0
          fi
          # 204 = is a collaborator. 404 = not a collaborator.
          # Anything else = fail loud (don't silently confuse denial with
          # API/transport errors).
          # NOTE: NO ?affiliation=direct — App-token queries treat that
          # filter strictly, and it excludes org-owners-with-admin-via-org
          # who SHOULD be authorized. The unfiltered endpoint returns 204
          # for any kind of collaborator (direct, team, outside, org owner),
          # which is what the auth model wants.
          http_code=$(gh api -i \
            "repos/promptdriven/pdd_cloud/collaborators/$REQUESTER" \
            2>/dev/null | head -n1 | awk '{print $2}' || true)
          case "$http_code" in
            204|200)
              echo "authorized: $REQUESTER is a pdd_cloud collaborator"
              ;;
            404)
              echo "::error::$REQUESTER is not a pdd_cloud collaborator; auto-heal blocked. A pdd_cloud collaborator must comment '/heal' to authorize."
              exit 1
              ;;
            *)
              echo "::error::pdd_cloud collaborator check returned HTTP '$http_code'; refusing to authorize. Likely transient — retry, or verify the App's installation and Metadata:Read permission."
              exit 1
              ;;
          esac

      - name: Authenticate to GCP via Workload Identity Federation
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        # SHA-pinned to v3.0.0 (https://github.com/google-github-actions/auth/releases/tag/v3.0.0)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/590888610376/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: pdd-public-heal-dispatcher@prompt-driven-development-stg.iam.gserviceaccount.com

      - name: Set up gcloud
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        # SHA-pinned to v3.0.1 (https://github.com/google-github-actions/setup-gcloud/releases/tag/v3.0.1)
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Submit Cloud Build (async)
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        id: gcb_submit
        env:
          PR_NUMBER: ${{ steps.pf.outputs.pr_number }}
        run: |
          set -euo pipefail
          # gcloud builds submit reads --config from the LOCAL filesystem
          # (not from inside the GCS source tarball). Extract the cloudbuild
          # config from the staged tarball into a temp dir first. The
          # extracted scripts also stay on the runner, but they're the same
          # 5 files cloudbuild itself unpacks at build time — not pdd_cloud
          # source.
          ctx_dir=$(mktemp -d)
          trap 'rm -rf "$ctx_dir"' EXIT
          gsutil cp gs://pdd-stg-build-contexts/auto-heal-pr-latest.tgz "$ctx_dir/source.tgz"
          tar -xzf "$ctx_dir/source.tgz" -C "$ctx_dir"
          # Use our own bucket for source staging so the dispatcher SA
          # doesn't need access to the default `<project>_cloudbuild`
          # bucket (which is restricted by org policy on this project).
          # No --gcs-log-dir: cloudbuild-pdd-cli-auto-heal-pr.yaml sets
          # `options.logging: CLOUD_LOGGING_ONLY` which conflicts with a
          # GCS log bucket; logs go to Cloud Logging.
          build_id=$(gcloud builds submit \
            gs://pdd-stg-build-contexts/auto-heal-pr-latest.tgz \
            --project=prompt-driven-development-stg \
            --config="$ctx_dir/cloudbuild-pdd-cli-auto-heal-pr.yaml" \
            --gcs-source-staging-dir=gs://pdd-stg-build-contexts/_staging \
            --substitutions=_PUBLIC_PR_NUMBER="$PR_NUMBER" \
            --async \
            --format='value(id)')
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Cloud Build $build_id submitted; polling for completion."

      - name: Wait for Cloud Build to complete
        if: steps.pf.outputs.skip != 'true' && steps.pf.outputs.fork == 'false'
        env:
          BUILD_ID: ${{ steps.gcb_submit.outputs.build_id }}
        run: |
          set -euo pipefail
          while true; do
            status=$(gcloud builds describe "$BUILD_ID" \
              --project=prompt-driven-development-stg \
              --format='value(status)')
            case "$status" in
              SUCCESS)
                echo "Cloud Build $BUILD_ID succeeded"
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build $BUILD_ID conclusion: $status"
                exit 1
                ;;
              QUEUED|WORKING|PENDING)
                sleep 30
                ;;
              *)
                echo "Unknown Cloud Build status '$status'; continuing to poll"
                sleep 30
                ;;
            esac
          done

      - name: Finalize check_run
        if: always() && steps.check_start.outputs.check_id && steps.pf.outputs.fork == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check_start.outputs.check_id }}
          STATUS: ${{ job.status }}
          BUILD_ID: ${{ steps.gcb_submit.outputs.build_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Map every non-success outcome to "failure" so branch protection
          # has unambiguous semantics. Cancelled / timed-out runs must not
          # silently allow merge.
          case "$STATUS" in
            success) conclusion=success ;;
            *)       conclusion=failure ;;
          esac
          # Summary is built from workflow-controlled values only. Never
          # interpolate event-derived strings into rendered markdown.
          if [ -n "${BUILD_ID:-}" ]; then
            summary="auto-heal $conclusion. Cloud Build: $BUILD_ID. [Workflow run]($RUN_URL)."
          else
            summary="auto-heal $conclusion (build did not start). [Workflow run]($RUN_URL)."
          fi
          gh api -X PATCH \
            "repos/$REPO/check-runs/$CHECK_ID" \
            -f status='completed' \
            -f conclusion="$conclusion" \
            -f "output[title]=auto-heal $conclusion" \
            -f "output[summary]=$summary"

  # This is intentionally a one-shot, manually dispatched migration. The App
  # must be pdd-cloud-auth-reader (ID 3672994); requesting Contents:Read here
  # cannot upgrade its externally managed permissions and therefore fails closed
  # until that App is upgraded outside this workflow.
  #
  # PDD_SECRET_MIGRATION_TOKEN is a temporary, environment-only fine-grained
  # credential scoped only to promptdriven/pdd with Environments read/write and
  # Secrets read/write. Deleting its GitHub Environment binding does not revoke
  # the credential; it must be revoked outside GitHub after the migration has
  # completed.
  copy_pdd_cloud_app_secrets_to_environment:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'promptdriven/pdd' &&
      github.ref_protected == true
    environment: pdd-cloud-read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      migration_state: ${{ steps.inspect_secret_provenance.outputs.migration_state }}
    env:
      PDD_CLOUD_APP_ID: ${{ secrets.PDD_CLOUD_APP_ID }}
      PDD_CLOUD_APP_PRIVATE_KEY: ${{ secrets.PDD_CLOUD_APP_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.PDD_SECRET_MIGRATION_TOKEN }}
      REPOSITORY: promptdriven/pdd
      ENVIRONMENT: pdd-cloud-read
      EXPECTED_PDD_CLOUD_APP_ID: "3672994"
    steps:
      - name: Validate exact manual-dispatch context
        id: validate_dispatch_context
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_REPOSITORY" != "promptdriven/pdd" ]; then
            echo "::error::Secret migration must be manually dispatched from promptdriven/pdd main."
            exit 1
          fi

      - name: Inspect App-secret provenance
        id: inspect_secret_provenance
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The environment migration credential is empty; refusing to inspect secrets."
            exit 1
          fi

          repository_secret_names=$(gh secret list --repo "$REPOSITORY" --json name --jq '.[].name')
          environment_secret_names=$(gh secret list --env "$ENVIRONMENT" --repo "$REPOSITORY" --json name --jq '.[].name')

          has_secret_name() {
            local secret_names="$1"
            local secret_name="$2"
            printf '%s\n' "$secret_names" | grep -Fxq -- "$secret_name"
          }

          legacy_repository_pat_secret_name="PRIVATE_REPO""_TOKEN"
          if has_secret_name "$repository_secret_names" "$legacy_repository_pat_secret_name"; then
            echo "::error::The legacy repository credential must be removed before this migration can run."
            exit 1
          fi

          repository_app_secret_count=0
          environment_app_secret_count=0
          for secret_name in PDD_CLOUD_APP_ID PDD_CLOUD_APP_PRIVATE_KEY; do
            if has_secret_name "$repository_secret_names" "$secret_name"; then
              repository_app_secret_count=$((repository_app_secret_count + 1))
            fi
            if has_secret_name "$environment_secret_names" "$secret_name"; then
              environment_app_secret_count=$((environment_app_secret_count + 1))
            fi
          done

          case "$repository_app_secret_count:$environment_app_secret_count" in
            2:0)
              migration_state=copy_from_repository
              ;;
            0:2)
              migration_state=already_migrated
              ;;
            *)
              echo "::error::App-secret provenance is partial or ambiguous; refusing to continue."
              exit 1
              ;;
          esac

          if [ -z "$PDD_CLOUD_APP_ID" ] ||
             [ "$PDD_CLOUD_APP_ID" != "$EXPECTED_PDD_CLOUD_APP_ID" ]; then
            echo "::error::Resolved App ID is not the expected pdd-cloud-auth-reader App."
            exit 1
          fi
          if [ -z "$PDD_CLOUD_APP_PRIVATE_KEY" ]; then
            echo "::error::Resolved App private key is empty; refusing to continue."
            exit 1
          fi

          printf 'migration_state=%s\n' "$migration_state" >> "$GITHUB_OUTPUT"
          echo "Migration provenance validated: $migration_state"

      - name: Copy App secrets into the restricted environment
        id: copy_environment_secrets
        if: steps.inspect_secret_provenance.outputs.migration_state == 'copy_from_repository'
        run: |
          set -euo pipefail
          if [ -z "$PDD_CLOUD_APP_ID" ] ||
             [ -z "$PDD_CLOUD_APP_PRIVATE_KEY" ] ||
             [ -z "$GH_TOKEN" ]; then
            echo "::error::A required migration credential is empty; refusing to change secrets."
            exit 1
          fi

          printf '%s' "$PDD_CLOUD_APP_ID" | gh secret set PDD_CLOUD_APP_ID --env pdd-cloud-read --repo promptdriven/pdd
          printf '%s' "$PDD_CLOUD_APP_PRIVATE_KEY" | gh secret set PDD_CLOUD_APP_PRIVATE_KEY --env pdd-cloud-read --repo promptdriven/pdd

  verify_pdd_cloud_and_retire_repository_app_secrets:
    needs: copy_pdd_cloud_app_secrets_to_environment
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'promptdriven/pdd' &&
      github.ref_protected == true
    environment: pdd-cloud-read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      PDD_CLOUD_APP_ID: ${{ secrets.PDD_CLOUD_APP_ID }}
      PDD_CLOUD_APP_PRIVATE_KEY: ${{ secrets.PDD_CLOUD_APP_PRIVATE_KEY }}
      GH_TOKEN: ${{ secrets.PDD_SECRET_MIGRATION_TOKEN }}
      REPOSITORY: promptdriven/pdd
      ENVIRONMENT: pdd-cloud-read
      EXPECTED_PDD_CLOUD_APP_ID: "3672994"
    steps:
      - name: Validate exact manual-dispatch context
        id: validate_dispatch_context
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_REPOSITORY" != "promptdriven/pdd" ]; then
            echo "::error::Secret migration must be manually dispatched from promptdriven/pdd main."
            exit 1
          fi

      - name: Validate migration state handoff
        id: validate_migration_state
        env:
          MIGRATION_STATE: ${{ needs.copy_pdd_cloud_app_secrets_to_environment.outputs.migration_state }}
        run: |
          set -euo pipefail
          case "$MIGRATION_STATE" in
            copy_from_repository|already_migrated)
              ;;
            *)
              echo "::error::Migration provenance state is missing or invalid."
              exit 1
              ;;
          esac

      - name: Require freshly resolved environment App secrets
        id: require_environment_app_secrets
        run: |
          set -euo pipefail
          if [ -z "$PDD_CLOUD_APP_ID" ] ||
             [ -z "$PDD_CLOUD_APP_PRIVATE_KEY" ] ||
             [ -z "$GH_TOKEN" ]; then
            echo "::error::Required environment App secret is empty; refusing to continue."
            exit 1
          fi
          if [ "$PDD_CLOUD_APP_ID" != "$EXPECTED_PDD_CLOUD_APP_ID" ]; then
            echo "::error::Resolved App ID is not the expected pdd-cloud-auth-reader App."
            exit 1
          fi

      - name: Mint pdd_cloud contents-read App token
        id: pdd_cloud_contents_token
        # SHA-pinned to v3.2.0 (https://github.com/actions/create-github-app-token/releases/tag/v3.2.0)
        # This request cannot grant Contents:Read; it fails closed until the
        # externally managed App permission has been upgraded for migration.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ env.PDD_CLOUD_APP_ID }}
          private-key: ${{ env.PDD_CLOUD_APP_PRIVATE_KEY }}
          owner: promptdriven
          repositories: pdd_cloud
          permission-contents: read
          # A dedicated always-run cleanup below revokes the token before any
          # repository-secret retirement step can receive the private token.
          skip-token-revoke: "true"

      - name: Verify the exact pdd_cloud canary commit
        id: verify_canary
        env:
          GH_TOKEN: ${{ steps.pdd_cloud_contents_token.outputs.token }}
          CANARY_REPOSITORY: promptdriven/pdd_cloud
          CANARY_SHA: 09f9d3fea71c4c0ed6655f2acd5e95b14a32c3c8
        run: |
          set -euo pipefail
          resolved_sha=$(gh api "repos/$CANARY_REPOSITORY/git/commits/$CANARY_SHA" --jq '.sha')
          if [ "$resolved_sha" != "$CANARY_SHA" ]; then
            echo "::error::The pdd_cloud canary did not resolve to the expected commit."
            exit 1
          fi

      - name: Revoke pdd_cloud App token
        id: revoke_pdd_cloud_token
        if: always() && steps.pdd_cloud_contents_token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.pdd_cloud_contents_token.outputs.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE /installation/token

      - name: Retire repository-level App secret copies
        id: retire_repository_app_secret_copies
        if: success() && steps.verify_canary.outcome == 'success' && steps.revoke_pdd_cloud_token.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository-management token is empty; refusing to retire secrets."
            exit 1
          fi

          repository_secret_names=(PDD_CLOUD_APP_PRIVATE_KEY PDD_CLOUD_APP_ID)
          current_secret_names=$(gh secret list --repo "$REPOSITORY" --json name --jq '.[].name')
          for secret_name in "${repository_secret_names[@]}"; do
            if printf '%s\n' "$current_secret_names" | grep -Fxq -- "$secret_name"; then
              gh secret delete "$secret_name" --repo "$REPOSITORY"
            fi
          done

          remaining_secret_names=$(gh secret list --repo "$REPOSITORY" --json name --jq '.[].name')
          for secret_name in "${repository_secret_names[@]}"; do
            if printf '%s\n' "$remaining_secret_names" | grep -Fxq -- "$secret_name"; then
              echo "::error::Repository secret $secret_name remains after retirement."
              exit 1
            fi
          done

      - name: Remove temporary environment migration credential binding
        id: delete_migration_token_secret
        if: success() && steps.retire_repository_app_secret_copies.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Environment migration credential is empty; refusing cleanup."
            exit 1
          fi

          migration_token_secret_name=PDD_SECRET_MIGRATION_TOKEN
          gh secret delete PDD_SECRET_MIGRATION_TOKEN --env "$ENVIRONMENT" --repo "$REPOSITORY"

          remaining_environment_secret_names=$(gh secret list --env "$ENVIRONMENT" --repo "$REPOSITORY" --json name --jq '.[].name')
          if printf '%s\n' "$remaining_environment_secret_names" | grep -Fxq -- "$migration_token_secret_name"; then
            echo "::error::Temporary environment migration credential remains bound after cleanup."
            exit 1
          fi
